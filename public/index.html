<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abu Nidal Trading — Bookings Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Abu Nidal Trading — WhatsApp Bookings</h1>
  </header>

  <main>
    <section>
      <h2>Bookings</h2>
      <table id="bookings-table">
        <thead>
          <tr>
            <th>When requested</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Service</th>
            <th>Notes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Customers</h2>
      <table id="customers-table">
        <thead>
          <tr>
            <th>Phone</th>
            <th>Name</th>
            <th>First contact</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="conversation-section" hidden>
      <h2>Conversation with <span id="conversation-customer"></span></h2>
      <button id="close-conversation">Close</button>
      <div id="conversation-messages"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
