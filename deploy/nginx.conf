# Reverse proxy for the WhatsApp bot. Copy to
# /etc/nginx/sites-available/abu-nidal-bot, replace YOUR_DOMAIN, then:
#   sudo ln -s /etc/nginx/sites-available/abu-nidal-bot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run this BEFORE requesting the SSL certificate (certbot edits this file
# in place to add the HTTPS block).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
